<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditMind - Criar Conta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-gray-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="w-full flex justify-center md:justify-start items-center px-6 md:px-12 py-8 z-20">
        <a href="index.html" class="no-underline hover:scale-105 transition-transform">
            <h1 class="text-3xl md:text-4xl font-extrabold italic tracking-tighter text-white">
                EDIT<span class="text-[#f97316] drop-shadow-[0_0_15px_rgba(249,115,22,0.5)]">MIND</span>
            </h1>
        </a>
    </header>

    <!-- Main -->
    <main class="flex-1 flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md">
            
            <!-- Card de Cadastro -->
            <div class="glass-panel rounded-[2rem] md:rounded-[3rem] p-8 md:p-12 border border-gray-800">
                
                <div class="text-center mb-8">
                    <h2 class="text-2xl md:text-3xl font-black text-white tracking-tight mb-2">
                        Criar conta
                    </h2>
                    <p class="text-gray-500 text-sm">
                        Comece a criar cortes virais com IA
                    </p>
                </div>

                <!-- Formulário -->
                <form id="form-cadastro" class="space-y-5">
                    
                    <!-- Nome -->
                    <div>
                        <label class="block text-[10px] md:text-xs font-black text-gray-500 uppercase tracking-widest mb-2">
                            Nome completo
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                </svg>
                            </div>
                            <input 
                                type="text" 
                                id="nome" 
                                placeholder="Seu nome"
                                class="w-full bg-[#0b0d11]/80 border border-gray-800 rounded-xl md:rounded-2xl pl-12 pr-4 py-4 text-sm text-white focus:border-[#f97316]/50 focus:shadow-[0_0_15px_rgba(249,115,22,0.1)] outline-none transition-all placeholder-gray-600"
                                required
                                minlength="2"
                            >
                        </div>
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-[10px] md:text-xs font-black text-gray-500 uppercase tracking-widest mb-2">
                            Email
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
                                </svg>
                            </div>
                            <input 
                                type="email" 
                                id="email" 
                                placeholder="seu@email.com"
                                class="w-full bg-[#0b0d11]/80 border border-gray-800 rounded-xl md:rounded-2xl pl-12 pr-4 py-4 text-sm text-white focus:border-[#f97316]/50 focus:shadow-[0_0_15px_rgba(249,115,22,0.1)] outline-none transition-all placeholder-gray-600"
                                required
                            >
                        </div>
                    </div>

                    <!-- Senha -->
                    <div>
                        <label class="block text-[10px] md:text-xs font-black text-gray-500 uppercase tracking-widest mb-2">
                            Senha
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                </svg>
                            </div>
                            <input 
                                type="password" 
                                id="senha" 
                                placeholder="Mínimo 6 caracteres"
                                class="w-full bg-[#0b0d11]/80 border border-gray-800 rounded-xl md:rounded-2xl pl-12 pr-4 py-4 text-sm text-white focus:border-[#f97316]/50 focus:shadow-[0_0_15px_rgba(249,115,22,0.1)] outline-none transition-all placeholder-gray-600"
                                required
                                minlength="6"
                            >
                        </div>
                        <p class="text-[10px] text-gray-600 mt-1">Mínimo 6 caracteres</p>
                    </div>

                    <!-- Confirmar Senha -->
                    <div>
                        <label class="block text-[10px] md:text-xs font-black text-gray-500 uppercase tracking-widest mb-2">
                            Confirmar senha
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                            </div>
                            <input 
                                type="password" 
                                id="confirmar-senha" 
                                placeholder="••••••••"
                                class="w-full bg-[#0b0d11]/80 border border-gray-800 rounded-xl md:rounded-2xl pl-12 pr-4 py-4 text-sm text-white focus:border-[#f97316]/50 focus:shadow-[0_0_15px_rgba(249,115,22,0.1)] outline-none transition-all placeholder-gray-600"
                                required
                            >
                        </div>
                    </div>

                    <!-- Botão -->
                    <button 
                        type="submit" 
                        id="btn-cadastro"
                        class="w-full bg-[#f97316] hover:bg-[#ea580c] text-white font-black py-4 rounded-xl md:rounded-2xl text-sm uppercase tracking-widest shadow-[0_15px_30px_rgba(249,115,22,0.3)] transition-all transform hover:scale-[1.02] active:scale-[0.98]"
                    >
                        Criar conta
                    </button>

                    <!-- Mensagem -->
                    <div id="mensagem" class="hidden text-center">
                        <p class="text-xs font-semibold"></p>
                    </div>
                </form>

                <!-- Divider -->
                <div class="flex items-center my-6">
                    <div class="flex-1 border-t border-gray-800"></div>
                    <span class="px-4 text-[10px] text-gray-500 font-bold uppercase">ou</span>
                    <div class="flex-1 border-t border-gray-800"></div>
                </div>

                <!-- Link Login -->
                <p class="text-center text-gray-500 text-sm">
                    Já tem uma conta? 
                    <a href="login.html" class="text-[#f97316] hover:text-[#ea580c] font-bold transition-colors">
                        Fazer login
                    </a>
                </p>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-6 border-t border-gray-800/50">
        <p class="text-xs font-semibold text-gray-600 tracking-widest uppercase">
            EditMind © 2026
        </p>
    </footer>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-cadastro');
            const msgDiv = document.getElementById('mensagem');
            const msgP = msgDiv.querySelector('p');
            
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const confirmar = document.getElementById('confirmar-senha').value;

            // Validação
            if (senha !== confirmar) {
                msgP.textContent = 'As senhas não coincidem';
                msgP.className = 'text-red-500 text-xs font-semibold';
                msgDiv.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Criando conta...';
            msgDiv.classList.add('hidden');

            const resultado = await Auth.cadastrar(nome, email, senha);

            if (resultado.sucesso) {
                msgP.textContent = 'Conta criada! Redirecionando...';
                msgP.className = 'text-green-500 text-xs font-semibold';
                msgDiv.classList.remove('hidden');
                setTimeout(() => window.location.href = 'app.html', 1500);
            } else {
                msgP.textContent = resultado.erro || 'Erro ao criar conta';
                msgP.className = 'text-red-500 text-xs font-semibold';
                msgDiv.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Criar conta';
            }
        });
    </script>
</body>
</html>
